name: Generate SideStore & Sileo Repositories

on:
  push:
    paths:
      - '*.ipa'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages Metadata
        id: pages
        uses: actions/configure-pages@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-utils jq dpkg-dev

      - name: Process App Formats
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Initialize HTML Web Page
          echo "<!DOCTYPE html><html><head><title>My Jailbreak & Sideload Repo</title>" > index.html
          echo "<meta name='viewport' content='width=device-width, initial-scale=1'>" >> index.html
          echo "<style>body{font-family:sans-serif; text-align:center; padding:50px;} .btn{display:inline-block; padding:12px 20px; background:#007aff; color:white; text-decoration:none; border-radius:8px; font-weight:bold; margin:10px;}</style></head><body>" >> index.html
          echo "<h1>My App Repository</h1>" >> index.html
          echo "<p>Sileo URL: <code>$BASE_URL</code></p>" >> index.html
          echo "<p>SideStore URL: <code>$BASE_URL/apps.json</code></p><hr>" >> index.html

          # Initialize SideStore File
          echo '{"name": "My Combined Repo", "identifier": "com.custom.combinedrepo", "apps": []}' > apps.json

          # Reset Sileo Directories
          rm -rf debs Packages Packages.gz Release
          mkdir -p debs

          for ipa in *.ipa; do
            [ -e "$ipa" ] || continue
            filename="${ipa%.*}"
            clean_name=$(echo "$filename" | sed 's/[^a-zA-Z0-9_.-]/_/g')

            # --- CRITICAL BULLETPROOF BUNDLE ID EXTRACTION ---
            # 1. Unzip the structure flatly to locate the info plist
            mkdir -p temp_extracted
            unzip -q "$ipa" -d temp_extracted/
            INFOPLIST_PATH=$(find temp_extracted/Payload -maxdepth 2 -name "Info.plist" | head -n 1)

            BUNDLE_ID=""
            VERSION=""
            DISPLAY_NAME=""

            if [ -f "$INFOPLIST_PATH" ]; then
              # Convert binary plist safely to readable XML
              plistutil -i "$INFOPLIST_PATH" -o parsed_info.plist || true
              if [ -f parsed_info.plist ]; then
                BUNDLE_ID=$(grep -A 1 "CFBundleIdentifier" parsed_info.plist | grep "<string>" | head -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
                VERSION=$(grep -A 1 "CFBundleShortVersionString" parsed_info.plist | grep "<string>" | head -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
                DISPLAY_NAME=$(grep -A 1 "CFBundleDisplayName" parsed_info.plist | grep "<string>" | head -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
              fi
            fi

            # Fallbacks if properties are absent
            BUNDLE_ID="${BUNDLE_ID:-com.example.$clean_name}"
            VERSION="${VERSION:-1.0.0}"
            DISPLAY_NAME="${DISPLAY_NAME:-$filename}"
            rm -rf temp_extracted parsed_info.plist

            IPA_URL="$BASE_URL/$ipa"
            PLIST_NAME="${clean_name}_manifest.plist"
            PLIST_URL="$BASE_URL/$PLIST_NAME"

            # 2. Build OTA Safari Manifest
            cat <<EOF > "$PLIST_NAME"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>$IPA_URL</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>$BUNDLE_ID</string>
                          <key>bundle-version</key>
                          <string>$VERSION</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>$DISPLAY_NAME</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

            # Append to landing webpage
            echo "<p><strong>$DISPLAY_NAME</strong> (v$VERSION) — <code>$BUNDLE_ID</code></p>" >> index.html
            echo "<a class='btn' href='itms-services://?action=download-manifest&url=$PLIST_URL'>Install via Safari</a><br><br>" >> index.html

            # 3. Populate SideStore JSON Source
            jq --arg name "$DISPLAY_NAME" \
               --arg id "$BUNDLE_ID" \
               --arg ver "$VERSION" \
               --arg url "$IPA_URL" \
               '.apps += [{name: $name, bundleIdentifier: $id, developerName: "Self-Published", version: $ver, versionDate: "2026-11-10", downloadURL: $url, localizedDescription: "Sideloaded via unified repository automation."}]' \
               apps.json > tmp.json && mv tmp.json apps.json

            # 4. Generate Sileo Package Architecture (.deb)
            # Sileo installs tweaks/apps packed inside a control structure.
            DEB_DIR="deb_building_$clean_name"
            mkdir -p "$DEB_DIR/DEBIAN"
            mkdir -p "$DEB_DIR/Applications"
            
            cat <<EOF > "$DEB_DIR/DEBIAN/control"
          Package: $BUNDLE_ID
          Name: $DISPLAY_NAME
          Version: $VERSION
          Architecture: iphoneos-arm
          Description: Dynamically compiled application package for jailbroken ecosystems.
          Maintainer: Continuous Integration Bot
          Author: Developer
          Section: Applications
          EOF

            # Pack raw IPA file tracking definitions for jailbreak managers
            cp "$ipa" "$DEB_DIR/Applications/${clean_name}.ipa"
            dpkg-deb --build "$DEB_DIR" "debs/${clean_name}.deb" >/dev/null
            rm -rf "$DEB_DIR"
          done

          echo "</body></html>" >> index.html

          # 5. Build Mandatory Sileo Repository Architecture
          dpkg-scanpackages -m debs > Packages
          gzip -c9 Packages > Packages.gz

          # Build Repo Release Identity Block
          cat <<EOF > Release
          Origin: My Automated Repository
          Label: Managed Source
          Suite: stable
          Version: 1.0.0
          Codename: ios
          Architectures: iphoneos-arm
          Components: main
          Description: Integrated Sileo ecosystem compilation.
          EOF

      - name: Commit and Push Compiled Ecosystem
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add *.plist index.html apps.json debs/* Packages Packages.gz Release
          git commit -m "Automated compile - Sileo and SideStore synchronization" || echo "Zero file mutations noticed."
          git push origin main
