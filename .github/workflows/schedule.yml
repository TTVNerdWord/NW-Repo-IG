name: Generate Third-Party App JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          pip install PyGithub pandas mistletoe lxml beautifulsoup4

      - name: Execute Python Script
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_json.py -t ${{ secrets.GITHUB_TOKEN }}

      - name: Auto Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Change"
          commit_options: '--no-verify --signoff'
          file_pattern: 'apps.json apps_esign.json bundleId.csv icons/*'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@://github.com"
          push_options: '--force'
